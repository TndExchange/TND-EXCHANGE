<style>

  html, body { margin: 0; min-height: 100%; }

  .brand svg { width: 48px; height: 48px; flex: none; }
  .brand-name { font-size: 1.25rem; font-weight: 700; color: var(--green-900); letter-spacing: -.01em; }

  .rate { margin: 0 0 26px; font-size: 1.05rem; color: var(--muted); }
  .rate strong { color: var(--green-700); font-weight: 600; }

  .group { margin-bottom: 16px; position: relative; }
  label, .label { display: block; font-size: 1rem; font-weight: 600; margin-bottom: 8px; }
  .field {
    display: flex; align-items: center; border: 2px solid var(--line); border-radius: 18px;
    background: #fff; padding: 0 18px; transition: border-color .2s, box-shadow .2s;
  }
  .field:focus-within { border-color: var(--green-500); box-shadow: 0 0 0 4px rgba(28,138,98,.14); }
  .field.invalid { border-color: var(--error); box-shadow: 0 0 0 4px rgba(179,38,30,.10); }
  .field input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 1.25rem; font-weight: 500; color: var(--ink); padding: 16px 0;

  .field.big input { font-size: 1.75rem; font-weight: 600; padding: 18px 0; }
  .field input::placeholder { color: #a9bdb3; font-weight: 400; }
  .unit { font-weight: 700; color: var(--green-700); font-size: 1.1rem; margin-left: 10px; }
  .error { min-height: 1.2em; margin: 6px 4px 0; font-size: .92rem; color: var(--error); }
  .hint { margin: 6px 4px 0; font-size: .9rem; color: var(--muted); }

  /* Custom select (with icons) */
  .select-btn {
    width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
    border: 2px solid var(--line); border-radius: 18px; background: #fff; color: var(--ink);
    font: inherit; font-size: 1.15rem; font-weight: 500; padding: 12px 16px; cursor: pointer;
    transition: border-color .2s, box-shadow .2s;
  }
  .select-btn:focus-visible, .select-btn[aria-expanded="true"] { outline: 0; border-color: var(--green-500); box-shadow: 0 0 0 4px rgba(28,138,98,.14); }
  .select-btn.invalid { border-color: var(--error); box-shadow: 0 0 0 4px rgba(179,38,30,.10); }
  .logo { display: block; width: 32px; height: 32px; min-width: 32px; max-width: 32px; max-height: 32px; flex: none; object-fit: contain; }
  .select-btn .txt { flex: 1; min-width: 0; }
  .select-btn .txt.placeholder { color: #8fa89d; font-weight: 400; }
  .select-btn .chev { width: 20px; height: 20px; flex: none; stroke: var(--green-700); fill: none; stroke-width: 2.4; transition: transform .2s; }
  .select-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .options {
    display: none; position: absolute; left: 0; right: 0; top: calc(100% - 2px); z-index: 20; margin: 0; padding: 6px;
    list-style: none; background: #fff; border: 2px solid var(--line); border-radius: 18px;
    box-shadow: 0 18px 36px -16px rgba(11,61,46,.35);
  }
  .options.open { display: block; animation: rise .2s ease both; }
  .options li {
    display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px;
    font-size: 1.1rem; font-weight: 500; cursor: pointer;

  .options li:hover, .options li.active { background: var(--green-50); }
  .options li[aria-selected="true"] { background: var(--green-100); color: var(--green-900); font-weight: 700; }

  .total { background: var(--green-50); border: 1px solid var(--line); border-radius: 20px; padding: 20px; margin: 4px 0 20px; }
  .total-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 1rem; color: var(--muted); padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px dashed var(--line); }
  .total-row b { color: var(--green-700); font-size: 1.1rem; font-variant-numeric: tabular-nums; }

  .total-amount { font-size: 2.5rem; font-weight: 700; color: var(--green-900); letter-spacing: -.02em; font-variant-numeric: tabular-nums; word-break: break-all; transition: transform .15s ease; }
  .total-amount.pop { transform: scale(1.03); }
  .total-currency { font-size: 1.25rem; font-weight: 700; color: var(--green-500); }

  .hp { position: absolute !important; left: -9999px; width: 1px; height: 1px; overflow: hidden; opacity: 0; }

  .buy {
    display: block; width: 100%; margin-top: 18px; border: 0; border-radius: 20px;
    background: var(--green-700); color: #fff; font: inherit; font-size: 1.25rem; font-weight: 700;

  .status { display: none; margin-top: 16px; padding: 16px 18px; border-radius: 16px; font-size: 1rem; line-height: 1.5; }
  .status.show { display: block; animation: rise .35s ease both; }
  .status.ok { background: var(--green-50); border: 1px solid var(--line); color: var(--green-900); }
  .status.fail { background: #fdf1f0; border: 1px solid #f1c9c6; color: var(--error); }
  .status a { color: inherit; font-weight: 700; }
  .note { margin: 16px 0 0; text-align: center; font-size: .85rem; color: var(--muted); }

  .wa {
    position: fixed; left: max(18px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom));

    transition: transform .2s; z-index: 10;
  }
  .wa::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--wa); animation: pulse 2.6s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .7; } 70%, 100% { transform: scale(1.55); opacity: 0; } }
  .wa:hover { transform: scale(1.06); }
  .wa:active { transform: scale(.94); }
  .wa svg { width: 34px; height: 34px; fill: #fff; }

  @media (max-width: 380px) { h1 { font-size: 2.1rem; } .total-amount { font-size: 2.1rem; } }
  @media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }

        var n = options.length;
        setActive((active + (k === "ArrowDown" ? 1 : -1) + n) % n);
      } else if (k === "Enter" || k === " ") {
        e.preventDefault();
        if (!isOpen()) open(); else { choose(active); close(true); }
      } else if (k === "Escape" && isOpen()) {
        e.preventDefault(); close(true);
      } else if (k === "Tab" && isOpen()) {
        close(false);
      }
    });
    document.addEventListener("click", function (e) { if (isOpen() && !root.contains(e.target)) close(false); });

    paint();
    return {
      select: function (i) { choose(i); },
      clear: function () { current = null; hidden.value = ""; paint(); },
      flag: function (on) { btn.classList.toggle("invalid", !!on); }
    };
  }

  var paySel = makeSelect($("sel-pay"), "l-pay", PAY_OPTIONS, $("h-pay"), "Select payment method", function () { $("e-pay").textContent = ""; });
  var recvSel = makeSelect($("sel-recv"), "l-recv", RECV_OPTIONS, $("h-recv"), "Select receiving method", function () { $("e-recv").textContent = ""; });
  paySel.select(0); // D17 is the only payment method, preselected

  function parseAmount(raw) {
    var v = raw.replace(",", ".").trim();
    if (!/^\d*\.?\d*$/.test(v) || v === "" || v === ".") return null;
    var n = parseFloat(v);
    return isFinite(n) ? n : null;
  }

  function setAmountError(msg) {
    $("f-usdt").classList.toggle("invalid", !!msg);
    $("e-usdt").textContent = msg || "";
  }

  function calc() {
    var amount = parseAmount(usdt.value);
    if (amount === null || amount < MIN_USDT || amount > MAX_USDT) return null;
    var rate = rateFor(amount);
    return { amount: amount, rate: rate, total: Math.round(amount * rate * 1000) / 1000 };
  }

  function updateTotal() {
    var cleaned = usdt.value.replace(/[^\d.,]/g, "");
    var i = cleaned.search(/[.,]/);
    if (i !== -1) cleaned = cleaned.slice(0, i + 1) + cleaned.slice(i + 1).replace(/[.,]/g, "");
    if (cleaned !== usdt.value) usdt.value = cleaned;

    var amount = parseAmount(usdt.value);
    var c = calc();

    rateEl.textContent = c ? "1 USDT = " + c.rate.toFixed(3) + " TND" : "—";
    totalEl.textContent = fmtTnd(c ? c.total : 0);
    $("h-rate").value = c ? "1 USDT = " + c.rate.toFixed(3) + " TND" : "";
    $("h-total").value = totalEl.textContent;
    totalEl.classList.add("pop");
    setTimeout(function () { totalEl.classList.remove("pop"); }, 150);

    if (usdt.value === "") setAmountError("");
    else if (amount === null || amount <= 0) setAmountError("Enter a valid amount of at least " + MIN_USDT + " USDT.");
    else if (amount < MIN_USDT) setAmountError("Minimum amount is " + MIN_USDT + " USDT. Please enter " + MIN_USDT + " USDT or more.");
    else if (amount > MAX_USDT) setAmountError("Maximum amount is " + fmtUsdt(MAX_USDT) + " USDT.");
    else setAmountError("");
  }

  function validate() {
    var good = true;
    var amount = parseAmount(usdt.value);
    if (usdt.value === "") { setAmountError("Enter the amount of USDT (minimum " + MIN_USDT + " USDT)."); good = false; }
    else if (!calc()) {
      setAmountError(amount !== null && amount > MAX_USDT ? "Maximum amount is " + fmtUsdt(MAX_USDT) + " USDT." : "Minimum amount is " + MIN_USDT + " USDT. Please enter " + MIN_USDT + " USDT or more.");
      good = false;
    }
    if (!$("h-pay").value) { $("e-pay").textContent = "Select a payment method."; paySel.flag(true); good = false; }
    if (!$("h-recv").value) { $("e-recv").textContent = "Select a receiving method."; recvSel.flag(true); good = false; }
    return good ? calc() : null;
  }

  function showStatus(kind, html) {
    status.className = "status show " + kind;
    status.innerHTML = html;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
  }

  function lastSent() { try { return parseInt(localStorage.getItem("tnd_last_sent") || "0", 10); } catch (e) { return 0; } }
  function markSent() { try { localStorage.setItem("tnd_last_sent", String(Date.now())); } catch (e) {} }

  function waUrl(d) {
    var msg = "Hello TND Exchange, I would like to buy USDT.\n" +
      "Amount: " + fmtUsdt(d.amount) + " USDT\n" +
      "Rate: 1 USDT = " + d.rate.toFixed(3) + " TND\n" +
      "Total: " + fmtTnd(d.total) + " TND\n" +
      "Payment method: " + d.pay + "\n" +
      "Receiving method: " + d.recv + "\n" +
      "Date: " + d.date;
    return "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(msg);
  }

  function timeoutFetch(url, opts, ms) {
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, ms);
    if (ctrl) opts.signal = ctrl.signal;
    return fetch(url, opts).then(function (r) { clearTimeout(timer); return r; },
                                 function (e) { clearTimeout(timer); throw e; });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    // Basic anti-spam checks (silent for bots)
    if (honey.value !== "") return;
    if (Date.now() - loadedAt < MIN_FILL_MS) {
      showStatus("fail", "Please take a moment to review your details, then send again.");
      return;
    }
    var wait = COOLDOWN_MS - (Date.now() - lastSent());
    if (wait > 0) {
      showStatus("fail", "A request was just sent. Please wait " + Math.ceil(wait / 1000) + " seconds before sending another.");
      return;
    }

    var c = validate();
    if (!c) {
      send.classList.remove("shake"); void send.offsetWidth; send.classList.add("shake");
      return;
    }

    var date = new Date().toLocaleString("en-GB", { timeZone: "Africa/Tunis", dateStyle: "medium", timeStyle: "short" }) + " (Tunis time)";
    var data = { amount: c.amount, rate: c.rate, total: c.total, pay: $("h-pay").value, recv: $("h-recv").value, date: date };
    var wa = waUrl(data);

    // Open WhatsApp immediately (inside the tap) so the browser does not block it.
    var win = window.open(wa, "_blank", "noopener");

    send.disabled = true;
    send.textContent = "Sending…";
    showStatus("ok", "Sending your request…");

    var payload = {
      "USDT amount": fmtUsdt(c.amount) + " USDT",
      "Exchange rate": "1 USDT = " + c.rate.toFixed(3) + " TND",
      "Total (TND)": fmtTnd(c.total) + " TND",
      "Payment method": data.pay,
      "Receiving method": data.recv,
      "Order date": date,
      _subject: "New USDT purchase request – TND Exchange",
      _template: "table",
      _captcha: "false"
    };

    timeoutFetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(payload)
    }, 15000)
    .then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        return { ok: res.ok, body: body };
      });
    })
    .then(function (r) {
      var success = r.ok && (r.body.success === true || r.body.success === "true");
      var waLink = '<a href="' + wa + '" target="_blank" rel="noopener noreferrer">Open WhatsApp</a>';
      var waNote = win
        ? "WhatsApp was opened with your order details. The message is <strong>not sent automatically</strong>: press Send in WhatsApp to deliver it."
        : "Your browser blocked WhatsApp. " + waLink + " and press Send to deliver your order message (it is not sent automatically).";
      if (success) {
        markSent();
        showStatus("ok", "<strong>Request submitted successfully.</strong> " + waNote);
        form.reset();
        recvSel.clear();
        paySel.select(0);
        updateTotal();
        loadedAt = Date.now();
      } else {
        var reason = r.body && r.body.message ? " (" + escapeHtml(r.body.message) + ")" : "";
        showStatus("fail", "<strong>Your request could not be submitted" + reason + ".</strong> Please try again, or contact us directly on WhatsApp: " + waLink + ".");
      }
    })
    .catch(function () {
      showStatus("fail", "<strong>Network error: your request was not submitted.</strong> Check your connection and try again, or contact us on WhatsApp: <a href=\"https://wa.me/" + PHONE + "\" target=\"_blank\" rel=\"noopener noreferrer\">wa.me/" + PHONE + "</a>.");
    })
    .then(function () {
      send.disabled = false;
      send.textContent = "Send Purchase Request";
    });
  });

  usdt.addEventListener("input", updateTotal);
  updateTotal();
})();
</script>
</body>
</html>
